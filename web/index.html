<!DOCTYPE html>
<html>

<head>
    <base href="/">
    <meta charset="UTF-8">
    <title>Dynamo Chess</title>
    <meta name="description" content="Premium 10x10 Strategic Chess Variant">
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="icons/Icon-192.png">
    <link rel="manifest" href="manifest.json">
    <meta name="google-signin-client_id" content="113235320266-su1i0t3rfgus7ftkc95nanitbf6gl8q6.apps.googleusercontent.com">
</head>

<body>
    <div id="loading">
        <style>
            body {
                inset: 0;
                overflow: hidden;
                margin: 0;
                padding: 0;
                position: fixed;
                background-color: #0A0E0A;
            }

            #loading {
                align-items: center;
                display: flex;
                height: 100%;
                justify-content: center;
                width: 100%;
                flex-direction: column;
            }

            #loading h1 {
                color: #D4AF37;
                font-family: sans-serif;
                margin-top: 20px;
                font-size: 18px;
                letter-spacing: 2px;
            }

            .spinner {
                border: 4px solid rgba(255, 255, 255, 0.1);
                width: 36px;
                height: 36px;
                border-radius: 50%;
                border-left-color: #D4AF37;
                animation: spin 1s linear infinite;
            }

            @keyframes spin {
                0% {
                    transform: rotate(0deg);
                }

                100% {
                    transform: rotate(360deg);
                }
            }
        </style>
        <div class="spinner"></div>
        <h1>LOADING DYNAMO CHESS...</h1>
    </div>
    <script src="main.dart.js" type="application/javascript"></script>
    <script>
        window.addEventListener('flutter-first-frame', function () {
            var loadingDiv = document.getElementById('loading');
            if (loadingDiv) {
                loadingDiv.remove();
            }
        });
    </script>
</body>

</html>
