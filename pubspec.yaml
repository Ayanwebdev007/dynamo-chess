name: dynamo_chess
description: A custom 10x10 chess game with unique rules.
version: 1.0.1+5

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  audioplayers: ^6.6.0
  firebase_auth: ^6.1.4
  firebase_core: ^4.4.0
  firebase_database: ^12.1.3
  flutter:
    sdk: flutter
  flutter_svg: ^2.0.7
  google_fonts: ^6.1.0
  uuid: ^4.5.2
  firebase_messaging: ^16.1.1
  flutter_local_notifications: ^18.0.1
  shared_preferences: ^2.2.2
  googleapis_auth: ^1.4.1
  http: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/dynamo_logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/dynamo_logo.png
    - assets/noflag.png
    - assets/inflag.png
    - assets/service_account.json
    - assets/pieces/
    - assets/pieces/king_w.png
    - assets/pieces/king_b.png
    - assets/pieces/queen_w.png
    - assets/pieces/queen_b.png
    - assets/pieces/rook_w.png
    - assets/pieces/rook_b.png
    - assets/pieces/bishop_w.png
    - assets/pieces/bishop_b.png
    - assets/pieces/knight_w.png
    - assets/pieces/knight_b.png
    - assets/pieces/pawn_w.png
    - assets/pieces/pawn_b.png
    - assets/pieces/missile_w.png
    - assets/pieces/missile_b.png
